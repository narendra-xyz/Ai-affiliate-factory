<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - AI Affiliate Factory</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div id="toast-container"></div>
<div class="layout" id="app-shell"></div>

<template id="tpl-content">
  <div class="card" style="margin-bottom:14px;">
    <div class="card-header">
      <h2>TikTok Integration</h2>
      <a href="/settings-tiktok.html" class="btn btn-secondary"><i data-lucide="external-link"></i> Buka Pengaturan TikTok</a>
    </div>
    <p class="card-sub" style="margin:-4px 0 0;">
      Hubungkan akun TikTok, atur akun autopilot, dan pantau status publish/permission.
    </p>
  </div>

  <div class="card" style="margin-bottom:14px;">
    <div class="card-header">
      <h2>TikTok Shop (Shoppable Video)</h2>
      <a href="/settings-tiktok-shop.html" class="btn btn-secondary"><i data-lucide="external-link"></i> Buka Pengaturan TikTok Shop</a>
    </div>
    <p class="card-sub" style="margin:-4px 0 0;">
      Hubungkan TikTok Shop Creator, kelola katalog produk, dan mapping produk untuk video shoppable.
    </p>
  </div>

  <div class="grid grid-2">
    <div class="card">
      <div class="card-header"><h2>Biaya (IDR)</h2></div>
      <div class="field">
        <label>Biaya Server per Bulan</label>
        <input id="s-server-cost" type="number">
      </div>
      <div class="field">
        <label>Biaya Lain per Bulan</label>
        <input id="s-other-cost" type="number">
      </div>
      <div class="field">
        <label>Batas Harga Maksimal Produk (kosongkan = tanpa batas)</label>
        <input id="s-max-price" type="number">
      </div>
      <button class="btn" onclick="saveSettings()"><i data-lucide="save"></i> Simpan Pengaturan</button>
    </div>

    <div class="card">
      <div class="card-header"><h2>Tambah Pengeluaran Manual</h2></div>
      <div class="field">
        <label>Kategori</label>
        <select id="e-category">
          <option value="server">Server</option>
          <option value="ai">AI</option>
          <option value="other">Lainnya</option>
        </select>
      </div>
      <div class="field">
        <label>Deskripsi</label>
        <input id="e-desc" placeholder="mis. biaya tambahan storage">
      </div>
      <div class="field">
        <label>Jumlah (IDR)</label>
        <input id="e-amount" type="number">
      </div>
      <button class="btn" onclick="addExpense()"><i data-lucide="plus"></i> Catat Pengeluaran</button>
    </div>
  </div>

  <div class="card" style="margin-top:14px;">
    <div class="card-header">
      <h2>Model per Agent</h2>
    </div>
    <p class="card-sub" style="margin:-4px 0 12px;">
      Model gratis dicoba sesuai urutan prioritas. Jika model teratas kena limit,
      sistem otomatis pindah ke model gratis berikutnya. Model berbayar hanya
      dipakai jika "Izinkan fallback berbayar" diaktifkan dan semua model gratis habis.
    </p>
    <div id="agent-model-list"></div>
  </div>

  <div class="card" style="margin-top:14px;">
    <div class="card-header"><h2>Status Integrasi</h2></div>
    <p class="card-sub" style="margin:-4px 0 12px;">
      Status jujur setiap integrasi eksternal. "Not Configured" berarti fitur terkait belum aktif -
      sistem tidak akan mengarang data untuk menutupinya.
    </p>
    <table>
      <thead><tr><th>Integrasi</th><th>Status</th><th>Keterangan</th></tr></thead>
      <tbody id="integrations-tbody"></tbody>
    </table>
  </div>
</template>

<div class="modal-backdrop" id="model-modal">
  <div class="modal" style="width:480px;">
    <div class="modal-header">
      <h3 id="model-modal-title">Atur Model</h3>
      <button class="modal-close" onclick="closeModelModal()"><i data-lucide="x"></i></button>
    </div>
    <div id="model-modal-body"></div>
    <button class="btn" style="width:100%;justify-content:center;margin-top:8px;" onclick="saveModelConfig()">
      <i data-lucide="save"></i> Simpan
    </button>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
  mountShell('/settings.html', 'Settings', 'Pengaturan biaya dan batasan sistem');
  document.getElementById('page-content').appendChild(document.getElementById('tpl-content').content.cloneNode(true));

  async function loadSettings() {
    try {
      const s = await apiFetch('/finance/settings');
      if (!s) return;
      document.getElementById('s-server-cost').value = s.serverCostMonthly;
      document.getElementById('s-other-cost').value = s.otherCostMonthly;
      document.getElementById('s-max-price').value = s.maxProductPrice;
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function saveSettings() {
    const body = {
      serverCostMonthly: Number(document.getElementById('s-server-cost').value) || 0,
      otherCostMonthly: Number(document.getElementById('s-other-cost').value) || 0,
    };
    const maxPrice = document.getElementById('s-max-price').value;
    if (maxPrice) body.maxProductPrice = Number(maxPrice);
    try {
      await apiFetch('/finance/settings', { method: 'PATCH', body: JSON.stringify(body) });
      showToast('Pengaturan disimpan');
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function addExpense() {
    const category = document.getElementById('e-category').value;
    const description = document.getElementById('e-desc').value;
    const amount = Number(document.getElementById('e-amount').value);
    if (!amount) return showToast('Jumlah harus diisi', 'error');
    try {
      await apiFetch('/finance/expenses', { method: 'POST', body: JSON.stringify({ category, description, amount }) });
      showToast('Pengeluaran dicatat');
      document.getElementById('e-desc').value = '';
      document.getElementById('e-amount').value = '';
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  loadSettings();

  // ---- Per-agent model config ----
  let currentAgentName = null;
  let agentConfigCache = {}; // avoids inlining raw JSON into onclick attributes

  function statusBadge(m) {
    if (m.live_status === 'limited') {
      return `<span class="badge badge-error"><span class="badge-dot"></span>limited</span>`;
    }
    return `<span class="badge badge-active"><span class="badge-dot"></span>tersedia</span>`;
  }

  async function loadAgentModels() {
    try {
      const agents = await apiFetch('/agents');
      if (!agents) return;
      const container = document.getElementById('agent-model-list');
      const rows = await Promise.all(
        agents.map(async (a) => {
          const cfg = await apiFetch(`/agents/${a.name}/model-config`);
          agentConfigCache[a.name] = cfg;
          return { agent: a, cfg };
        })
      );
      container.innerHTML = rows.map(({ agent, cfg }) => `
        <div class="card" style="background:var(--surface-2);margin-bottom:10px;">
          <div class="card-header">
            <h2 style="font-size:13.5px;">${agent.display_name}</h2>
            <button class="btn btn-secondary" onclick="openModelModal('${agent.name}')">
              <i data-lucide="settings-2"></i> Atur
            </button>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            ${(cfg.models || []).map((m, i) => `
              <div style="display:flex;align-items:center;justify-content:space-between;font-size:12.5px;">
                <span>${i + 1}. ${m.id} <span style="color:var(--text-muted);">(${m.tier}${m.daily_limit ? ', limit ' + m.daily_limit + '/hari' : ''})</span></span>
                ${statusBadge(m)}
              </div>
            `).join('')}
          </div>
          <p class="card-sub" style="margin-top:8px;">
            Fallback berbayar: <strong>${cfg.allow_paid_fallback ? 'Diizinkan' : 'Tidak diizinkan'}</strong>
          </p>
        </div>
      `).join('');
      lucide.createIcons();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  function openModelModal(agentName) {
    currentAgentName = agentName;
    const cfg = agentConfigCache[agentName] || {};
    document.getElementById('model-modal-title').textContent = `Atur Model - ${agentName}`;
    const body = document.getElementById('model-modal-body');
    body.innerHTML = `
      <div class="field">
        <label>Urutan Model (satu per baris, prioritas dari atas ke bawah)</label>
        <textarea id="mm-models" rows="5">${(cfg.models || []).map((m) => `${m.id},${m.tier},${m.daily_limit || ''}`).join('\n')}</textarea>
        <p class="card-sub" style="margin-top:4px;">Format: model_id,tier(free/paid),daily_limit(opsional)</p>
      </div>
      <div class="field">
        <label style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" id="mm-allow-paid" style="width:auto;" ${cfg.allow_paid_fallback ? 'checked' : ''}>
          Izinkan fallback ke model berbayar jika semua model gratis limit
        </label>
      </div>
    `;
    document.getElementById('model-modal').classList.add('open');
    lucide.createIcons();
  }

  function closeModelModal() {
    document.getElementById('model-modal').classList.remove('open');
  }

  async function saveModelConfig() {
    const lines = document.getElementById('mm-models').value.split('\n').map((l) => l.trim()).filter(Boolean);
    const models = lines.map((line) => {
      const [id, tier, dailyLimit] = line.split(',').map((s) => s.trim());
      return { id, tier: tier === 'paid' ? 'paid' : 'free', daily_limit: dailyLimit ? Number(dailyLimit) : null };
    });
    const allow_paid_fallback = document.getElementById('mm-allow-paid').checked;
    try {
      await apiFetch(`/agents/${currentAgentName}/model-config`, {
        method: 'PATCH',
        body: JSON.stringify({ models, allow_paid_fallback }),
      });
      showToast('Konfigurasi model disimpan');
      closeModelModal();
      loadAgentModels();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  loadAgentModels();

  // ---- Integration status ----
  async function loadIntegrations() {
    try {
      const integrations = await apiFetch('/system/integrations');
      if (!integrations) return;
      document.getElementById('integrations-tbody').innerHTML = integrations.map((i) => `
        <tr>
          <td>${i.name}</td>
          <td>${i.configured
            ? `<span class="badge badge-active"><span class="badge-dot"></span>Configured</span>`
            : `<span class="badge badge-idle"><span class="badge-dot"></span>Not Configured</span>`}</td>
          <td style="color:var(--text-muted);font-size:12.5px;">${i.detail}</td>
        </tr>
      `).join('');
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  loadIntegrations();
</script>
</body>
</html>
