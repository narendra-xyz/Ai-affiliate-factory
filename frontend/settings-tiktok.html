<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - TikTok - AI Affiliate Factory</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div id="toast-container"></div>
<div class="layout" id="app-shell"></div>

<template id="tpl-content">
  <div class="card" style="margin-bottom:14px;">
    <div class="card-header">
      <h2>Status Integrasi TikTok</h2>
      <button class="btn" id="connect-btn"><i data-lucide="link"></i> Connect TikTok Account</button>
    </div>
    <table>
      <tbody>
        <tr><td>App Terkonfigurasi</td><td id="s-app-status">-</td></tr>
        <tr><td>Keterangan</td><td id="s-app-detail" style="color:var(--text-muted);">-</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <div class="card-header"><h2>Akun Terhubung</h2></div>
    <table>
      <thead>
        <tr><th></th><th>Username</th><th>Status</th><th>Permission</th><th>Autopilot</th><th>Token Berlaku Sampai</th><th></th></tr>
      </thead>
      <tbody id="accounts-tbody"></tbody>
    </table>
    <p id="accounts-empty" style="color:var(--text-muted);display:none;margin-top:12px;">
      Belum ada akun TikTok yang terhubung.
    </p>
  </div>
</template>

<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
  mountShell('/settings.html', 'Settings - TikTok', 'Kelola koneksi akun TikTok untuk publishing dan performance sync');
  document.getElementById('page-content').appendChild(document.getElementById('tpl-content').content.cloneNode(true));

  // Show a toast based on the OAuth callback redirect query params.
  (function handleOAuthRedirect() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('connected')) {
      showToast('Akun TikTok berhasil terhubung');
      window.history.replaceState({}, '', '/settings-tiktok.html');
    } else if (params.get('error')) {
      showToast(`Gagal menghubungkan TikTok: ${params.get('error')}`, 'error');
      window.history.replaceState({}, '', '/settings-tiktok.html');
    }
  })();

  document.getElementById('connect-btn').addEventListener('click', () => {
    const token = getToken();
    if (!token) { showToast('Sesi login tidak ditemukan', 'error'); return; }
    // Full-page navigation (not apiFetch) since this is a browser redirect
    // flow to TikTok's own authorize page - the JWT is passed via query
    // string here because a plain link click can't attach a header.
    window.location.href = `/api/tiktok/auth/connect?token=${encodeURIComponent(token)}`;
  });

  function statusBadge(status) {
    const map = { connected: 'active', expired: 'error', error: 'error', disconnected: 'idle' };
    return `<span class="badge badge-${map[status] || 'idle'}"><span class="badge-dot"></span>${status}</span>`;
  }

  function scopeBadges(scopes) {
    const list = (scopes || '').split(/[\s,]+/).filter(Boolean);
    if (list.length === 0) return '<span style="color:var(--text-muted);">-</span>';
    return list.map((s) => `<span class="badge badge-idle" style="margin-right:4px;"><span class="badge-dot"></span>${s}</span>`).join('');
  }

  async function loadIntegrationStatus() {
    try {
      const integrations = await apiFetch('/system/integrations');
      if (!integrations) return;
      const tiktok = integrations.find((i) => i.key === 'tiktok');
      if (!tiktok) return;
      document.getElementById('s-app-status').innerHTML = tiktok.configured
        ? `<span class="badge badge-active"><span class="badge-dot"></span>Configured</span>`
        : `<span class="badge badge-idle"><span class="badge-dot"></span>Not Configured</span>`;
      document.getElementById('s-app-detail').textContent = tiktok.detail;
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function refreshInfo(id) {
    try {
      await apiFetch(`/tiktok/accounts/${id}/refresh-info`, { method: 'POST' });
      showToast('Info akun diperbarui');
      loadAccounts();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function setAutopilot(id) {
    try {
      await apiFetch(`/tiktok/accounts/${id}/set-autopilot`, { method: 'POST' });
      showToast('Akun autopilot diperbarui');
      loadAccounts();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function disconnect(id) {
    if (!confirm('Putuskan koneksi akun TikTok ini?')) return;
    try {
      await apiFetch(`/tiktok/accounts/${id}/disconnect`, { method: 'POST' });
      showToast('Akun terputus');
      loadAccounts();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function loadAccounts() {
    try {
      const accounts = await apiFetch('/tiktok/accounts');
      if (!accounts) return;

      document.getElementById('accounts-empty').style.display = accounts.length === 0 ? 'block' : 'none';
      document.getElementById('accounts-tbody').innerHTML = accounts.map((a) => `
        <tr>
          <td>${a.avatar_url ? `<img src="${a.avatar_url}" style="width:32px;height:32px;border-radius:50%;">` : `<div style="width:32px;height:32px;border-radius:50%;background:var(--surface-2);"></div>`}</td>
          <td>${a.username || a.display_name || a.tiktok_open_id}</td>
          <td>${statusBadge(a.status)}</td>
          <td>${scopeBadges(a.scopes)}</td>
          <td>${a.is_autopilot_account ? '<span class="badge badge-active"><span class="badge-dot"></span>Ya</span>' : `<button class="btn btn-secondary" onclick="setAutopilot(${a.id})">Set Autopilot</button>`}</td>
          <td style="color:var(--text-muted);font-size:12px;">${a.access_token_expires_at ? new Date(a.access_token_expires_at).toLocaleString('id-ID') : '-'}</td>
          <td>
            <div class="dropdown">
              <button class="btn btn-secondary" onclick="this.nextElementSibling.classList.toggle('open')"><i data-lucide="more-horizontal"></i></button>
              <div class="dropdown-menu">
                <button onclick="refreshInfo(${a.id})">Refresh Info</button>
                <button onclick="disconnect(${a.id})">Disconnect</button>
              </div>
            </div>
          </td>
        </tr>
      `).join('');
      lucide.createIcons();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  document.addEventListener('click', (e) => {
    document.querySelectorAll('.dropdown-menu.open').forEach((el) => {
      if (!el.parentElement.contains(e.target)) el.classList.remove('open');
    });
  });

  loadIntegrationStatus();
  loadAccounts();
</script>
</body>
</html>
