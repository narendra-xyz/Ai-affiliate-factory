<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos - AI Affiliate Factory</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div id="toast-container"></div>
<div class="layout" id="app-shell"></div>

<template id="tpl-content">
  <div class="card" style="margin-bottom:14px;">
    <div class="card-header"><h2>Filter</h2></div>
    <div class="grid grid-4">
      <div class="field" style="margin-bottom:0;">
        <label>Status</label>
        <select id="f-status">
          <option value="">Semua</option>
          <option value="draft">Draft</option>
          <option value="review">Review</option>
          <option value="approved">Approved</option>
          <option value="ready_to_publish">Ready to Publish</option>
          <option value="published">Published</option>
          <option value="failed">Failed</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Produk</label>
        <select id="f-product"><option value="">Semua Produk</option></select>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Urutkan</label>
        <select id="f-sort">
          <option value="date">Terbaru</option>
          <option value="profit">Profit Tertinggi</option>
          <option value="commission">Commission Tertinggi</option>
          <option value="views">Views Tertinggi</option>
          <option value="orders">Orders Tertinggi</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:0;display:flex;align-items:flex-end;">
        <button class="btn" style="width:100%;justify-content:center;" onclick="loadVideos()">
          <i data-lucide="filter"></i> Terapkan
        </button>
      </div>
    </div>
    <div class="grid grid-2" style="margin-top:12px;">
      <div class="field" style="margin-bottom:0;">
        <label>Dari Tanggal</label>
        <input type="date" id="f-from">
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Sampai Tanggal</label>
        <input type="date" id="f-to">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><h2>Semua Video</h2></div>
    <table>
      <thead>
        <tr>
          <th></th><th>Judul</th><th>Produk</th><th>Agent</th><th>Platform</th><th>Status</th>
          <th>TikTok</th><th>Dibuat</th><th>Views</th><th>Clicks</th><th>Orders</th><th>Commission</th><th>Profit</th><th>Rating</th><th></th>
        </tr>
      </thead>
      <tbody id="videos-tbody"></tbody>
    </table>
  </div>
</template>

<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
  mountShell('/videos.html', 'Videos', 'Kelola dan pantau seluruh video affiliate');
  document.getElementById('page-content').appendChild(document.getElementById('tpl-content').content.cloneNode(true));

  function badge(status) {
    return `<span class="badge badge-${status}"><span class="badge-dot"></span>${status.replace(/_/g, ' ')}</span>`;
  }

  function tiktokBadge(status) {
    if (!status) return `<span style="color:var(--text-muted);font-size:12px;">-</span>`;
    const map = { queued: 'idle', uploading: 'processing', processing: 'processing', published: 'active', failed: 'error' };
    return `<span class="badge badge-${map[status] || 'idle'}"><span class="badge-dot"></span>${status}</span>`;
  }

  function thumb(v) {
    if (v.thumbnail_path) {
      return `<img src="${v.thumbnail_path}" style="width:48px;height:48px;object-fit:cover;border-radius:6px;">`;
    }
    return `<div style="width:48px;height:48px;border-radius:6px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-muted);"><i data-lucide="clapperboard" style="width:18px;height:18px;"></i></div>`;
  }

  async function loadProductOptions() {
    try {
      const products = await apiFetch('/products');
      if (!products) return;
      const select = document.getElementById('f-product');
      select.innerHTML = '<option value="">Semua Produk</option>' +
        products.map((p) => `<option value="${p.id}">${p.name}</option>`).join('');
    } catch (err) {
      // non-fatal for this page
    }
  }

  async function retryVideo(id) {
    try {
      await apiFetch(`/videos/${id}/retry`, { method: 'POST' });
      showToast('Video di-retry, akan diproses ulang');
      loadVideos();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function loadVideos() {
    const status = document.getElementById('f-status').value;
    const productId = document.getElementById('f-product').value;
    const sortBy = document.getElementById('f-sort').value;
    const from = document.getElementById('f-from').value;
    const to = document.getElementById('f-to').value;
    const params = new URLSearchParams();
    if (status) params.set('status', status);
    if (productId) params.set('productId', productId);
    if (sortBy) params.set('sortBy', sortBy);
    if (from) params.set('from', from);
    if (to) params.set('to', to);

    try {
      const rows = await apiFetch(`/videos?${params.toString()}`);
      if (!rows) return;
      document.getElementById('videos-tbody').innerHTML = rows.map((v) => `
        <tr>
          <td>${thumb(v)}</td>
          <td><a href="/video-detail.html?id=${v.id}" style="color:var(--text);text-decoration:none;">${v.title || '(untitled)'}</a></td>
          <td>${v.product_name || '-'}</td>
          <td>${(v.agent_name || '-').replace(/_/g, ' ')}</td>
          <td>${v.platform || '-'}</td>
          <td>${badge(v.status)}</td>
          <td>${tiktokBadge(v.tiktok_status)}</td>
          <td>${v.created_at ? v.created_at.slice(0, 16).replace('T', ' ') : '-'}</td>
          <td>${(v.views || 0).toLocaleString('id-ID')}</td>
          <td>${(v.clicks || 0).toLocaleString('id-ID')}</td>
          <td>${(v.orders || 0).toLocaleString('id-ID')}</td>
          <td>${formatIDR(v.commission)}</td>
          <td style="color:${v.profit >= 0 ? 'var(--success)' : 'var(--danger)'};">${formatIDR(v.profit)}</td>
          <td>${v.critic_rating ?? '-'}</td>
          <td>${v.status === 'failed' ? `<button class="btn btn-secondary" onclick="retryVideo(${v.id})"><i data-lucide="rotate-ccw"></i></button>` : ''}</td>
        </tr>
      `).join('') || `<tr><td colspan="15" style="text-align:center;color:var(--text-muted);">Belum ada video</td></tr>`;
      lucide.createIcons();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  loadProductOptions();
  loadVideos();
</script>
</body>
</html>
