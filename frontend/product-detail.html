<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Produk - AI Affiliate Factory</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div id="toast-container"></div>
<div class="layout" id="app-shell"></div>

<template id="tpl-content">
  <div class="grid grid-4" style="margin-bottom:14px;">
    <div class="card"><p class="card-title">Total Videos</p><p class="card-value" id="p-videos">-</p></div>
    <div class="card"><p class="card-title">Total Views</p><p class="card-value" id="p-views">-</p></div>
    <div class="card"><p class="card-title">Total Clicks</p><p class="card-value" id="p-clicks">-</p></div>
    <div class="card"><p class="card-title">Total Orders</p><p class="card-value" id="p-orders">-</p></div>
  </div>
  <div class="grid grid-4" style="margin-bottom:14px;">
    <div class="card"><p class="card-title">Conversion Rate</p><p class="card-value" id="p-conv">-</p></div>
    <div class="card"><p class="card-title">Commission</p><p class="card-value" id="p-commission">-</p></div>
    <div class="card"><p class="card-title">Profit</p><p class="card-value" id="p-profit">-</p></div>
    <div class="card"><p class="card-title">Rata-rata Views/Video</p><p class="card-value" id="p-avgviews">-</p></div>
  </div>

  <div class="card" style="margin-bottom:14px;">
    <div class="card-header"><h2>Info Produk</h2></div>
    <table>
      <tr><td>Nama</td><td id="p-name">-</td></tr>
      <tr><td>Niche</td><td id="p-niche">-</td></tr>
      <tr><td>Harga</td><td id="p-price">-</td></tr>
      <tr><td>Komisi</td><td id="p-comm-rate">-</td></tr>
      <tr><td>Rating Produk</td><td id="p-rating">-</td></tr>
      <tr><td>Skor Product Hunter</td><td id="p-score">-</td></tr>
      <tr><td>Alasan Skor</td><td id="p-score-reason">-</td></tr>
      <tr><td>Status</td><td id="p-status">-</td></tr>
      <tr><td>Rata-rata Rating Critic</td><td id="p-avg-rating">-</td></tr>
      <tr>
        <td>TikTok Shop Product ID</td>
        <td>
          <div style="display:flex;gap:8px;align-items:center;">
            <input id="p-tiktok-shop-id" placeholder="Belum dihubungkan" style="max-width:220px;">
            <button class="btn btn-secondary" onclick="saveTikTokShopMapping()">Simpan</button>
          </div>
        </td>
      </tr>
    </table>
  </div>

  <div class="card">
    <div class="card-header"><h2>Video dari Produk Ini</h2></div>
    <table>
      <thead>
        <tr><th>Judul</th><th>Platform</th><th>Status</th><th>Views</th><th>Orders</th><th>Commission</th><th>Rating</th></tr>
      </thead>
      <tbody id="p-videos-tbody"></tbody>
    </table>
  </div>
</template>

<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
  mountShell('/products.html', 'Detail Produk', 'Statistik lengkap dan histori video per produk');
  document.getElementById('page-content').appendChild(document.getElementById('tpl-content').content.cloneNode(true));

  const productId = new URLSearchParams(window.location.search).get('id');

  function badge(status) {
    return `<span class="badge badge-${status}"><span class="badge-dot"></span>${status.replace(/_/g, ' ')}</span>`;
  }

  async function load() {
    if (!productId) { showToast('ID produk tidak ditemukan', 'error'); return; }
    try {
      const p = await apiFetch(`/products/${productId}`);
      if (!p) return;

      document.getElementById('p-videos').textContent = p.stats.total_videos;
      document.getElementById('p-views').textContent = (p.stats.total_views || 0).toLocaleString('id-ID');
      document.getElementById('p-clicks').textContent = (p.stats.total_clicks || 0).toLocaleString('id-ID');
      document.getElementById('p-orders').textContent = (p.stats.total_orders || 0).toLocaleString('id-ID');
      document.getElementById('p-conv').textContent = `${p.stats.conversion_rate}%`;
      document.getElementById('p-commission').textContent = formatIDR(p.stats.commission);
      document.getElementById('p-profit').innerHTML = `<span style="color:${p.stats.profit >= 0 ? 'var(--success)' : 'var(--danger)'};">${formatIDR(p.stats.profit)}</span>`;
      document.getElementById('p-avgviews').textContent = (p.stats.avg_views_per_video || 0).toLocaleString('id-ID');

      document.getElementById('p-name').textContent = p.name;
      document.getElementById('p-niche').textContent = p.niche || '-';
      document.getElementById('p-price').textContent = formatIDR(p.price);
      document.getElementById('p-comm-rate').textContent = `${p.commission_rate}%`;
      document.getElementById('p-rating').textContent = p.rating ?? '-';
      document.getElementById('p-score').textContent = p.score ?? '-';
      document.getElementById('p-score-reason').textContent = p.score_reason || '-';
      document.getElementById('p-status').innerHTML = badge(p.status);
      document.getElementById('p-avg-rating').textContent = (p.stats.avg_rating || 0).toFixed(1);
      document.getElementById('p-tiktok-shop-id').value = p.tiktok_shop_product_id || '';

      document.getElementById('p-videos-tbody').innerHTML = (p.videos || []).map((v) => `
        <tr>
          <td><a href="/video-detail.html?id=${v.id}" style="color:var(--text);text-decoration:none;">${v.title || '(untitled)'}</a></td>
          <td>${v.platform || '-'}</td>
          <td>${badge(v.status)}</td>
          <td>${(v.views || 0).toLocaleString('id-ID')}</td>
          <td>${(v.orders || 0).toLocaleString('id-ID')}</td>
          <td>${formatIDR(v.commission)}</td>
          <td>${v.critic_rating ?? '-'}</td>
        </tr>
      `).join('') || `<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">Belum ada video</td></tr>`;

      lucide.createIcons();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function saveTikTokShopMapping() {
    const value = document.getElementById('p-tiktok-shop-id').value.trim();
    try {
      await apiFetch(`/tiktok-shop/product-mapping/${productId}`, {
        method: 'PATCH',
        body: JSON.stringify({ tiktokShopProductId: value || null }),
      });
      showToast('Mapping TikTok Shop product ID disimpan');
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  load();
</script>
</body>
</html>
