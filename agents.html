<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agents - AI Affiliate Factory</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div id="toast-container"></div>
<div class="layout" id="app-shell"></div>

<template id="tpl-content">
  <div class="grid grid-3" id="agent-cards" style="margin-bottom:14px;"></div>

  <div class="card" style="margin-bottom:14px;">
    <div class="card-header"><h2>Pola yang Sudah Dipelajari (Money Agent)</h2></div>
    <div class="command-log" id="learned-insights"></div>
  </div>

  <div class="card">
    <div class="card-header"><h2>Log Aktivitas Terbaru</h2></div>
    <div class="command-log" id="agent-logs"></div>
  </div>
</template>

<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
  mountShell('/agents.html', 'Agents', 'Monitor status dan aktivitas setiap AI agent');
  document.getElementById('page-content').appendChild(document.getElementById('tpl-content').content.cloneNode(true));

  function badge(status) {
    return `<span class="badge badge-${status}"><span class="badge-dot"></span>${status}</span>`;
  }

  async function toggleAgent(name, currentStatus) {
    const next = currentStatus === 'disabled' ? 'idle' : 'disabled';
    try {
      await apiFetch(`/agents/${name}/status`, { method: 'PATCH', body: JSON.stringify({ status: next }) });
      showToast(`${name} sekarang ${next}`);
      loadAgents();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function loadAgents() {
    try {
      const agents = await apiFetch('/agents');
      if (!agents) return;
      document.getElementById('agent-cards').innerHTML = agents.map((a) => `
        <div class="card">
          <div class="card-header">
            <h2>${a.display_name}</h2>
            ${badge(a.status)}
          </div>
          <p class="card-sub">Task saat ini: ${a.current_task || '-'}</p>
          <p class="card-sub">Task terakhir: ${a.last_task || '-'}</p>
          <button class="btn btn-secondary" style="margin-top:10px;" onclick="toggleAgent('${a.name}','${a.status}')">
            <i data-lucide="${a.status === 'disabled' ? 'play' : 'pause'}"></i>
            ${a.status === 'disabled' ? 'Aktifkan' : 'Nonaktifkan'}
          </button>
        </div>
      `).join('');
      lucide.createIcons();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function loadLogs() {
    try {
      const logs = await apiFetch('/agents/logs/recent?limit=50');
      if (!logs) return;
      document.getElementById('agent-logs').innerHTML = logs.map((l) => `
        <div class="command-entry">
          <div class="cmd-text">[${l.agent_name}] ${l.message}</div>
          <div class="cmd-meta">${l.level} - ${l.created_at}</div>
        </div>
      `).join('') || `<p style="color:var(--text-muted);">Belum ada log</p>`;
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function loadInsights() {
    try {
      const insights = await apiFetch('/agents/insights?limit=20');
      if (!insights) return;
      document.getElementById('learned-insights').innerHTML = insights.map((i) => `
        <div class="command-entry">
          <div class="cmd-text">${i.insight_text}</div>
          <div class="cmd-meta">${i.category === 'winning_pattern' ? 'pola menang' : 'peringatan'} - ${i.created_at}</div>
        </div>
      `).join('') || `<p style="color:var(--text-muted);">Belum ada insight. Jalankan "Ulangi format video yang performanya paling bagus" atau "Analisis kenapa video kemarin gagal" di Command Center.</p>`;
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  loadAgents();
  loadLogs();
  loadInsights();
  setInterval(() => { loadAgents(); loadLogs(); loadInsights(); }, 15000);
</script>
</body>
</html>
