<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center - AI Affiliate Factory</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div id="toast-container"></div>
<div class="layout" id="app-shell"></div>

<template id="tpl-content">
  <div class="card" style="margin-bottom:14px;">
    <div class="card-header"><h2>Berikan Perintah</h2></div>
    <div class="command-box">
      <input id="command-input" placeholder='mis. "Buat 10 video untuk produk terbaik minggu ini"'>
      <button class="btn" onclick="sendCommand()"><i data-lucide="send"></i> Kirim</button>
    </div>
    <p class="card-sub" style="margin-top:10px;">
      Contoh: "Cari produk affiliate baru", "Fokus niche gaming", "Analisis kenapa video kemarin gagal",
      "Analisis video yang performanya buruk", "Buat variasi dari video terbaik", "Hentikan semua agent",
      "Tampilkan profit minggu ini", "Jangan pilih produk di atas Rp200.000".
    </p>
  </div>

  <div class="card">
    <div class="card-header"><h2>Riwayat Perintah</h2></div>
    <div class="command-log" id="command-history"></div>
  </div>
</template>

<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
  mountShell('/command-center.html', 'Command Center', 'Berikan perintah natural language langsung ke sistem AI');
  document.getElementById('page-content').appendChild(document.getElementById('tpl-content').content.cloneNode(true));

  let pollTimer = null;

  async function sendCommand() {
    const input = document.getElementById('command-input');
    const text = input.value.trim();
    if (!text) return;
    try {
      const res = await apiFetch('/commands', { method: 'POST', body: JSON.stringify({ text }) });
      if (!res) return;
      showToast(res.result?.async ? `Perintah dimulai (berjalan di background): ${res.action}` : `Perintah selesai: ${res.action}`);
      input.value = '';
      loadHistory();
      ensurePolling();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && document.activeElement.id === 'command-input') sendCommand();
  });

  function statusBadge(status) {
    const map = {
      done: 'active', executing: 'processing', received: 'idle',
      failed: 'error', rejected: 'error',
    };
    return `<span class="badge badge-${map[status] || 'idle'}"><span class="badge-dot"></span>${status}</span>`;
  }

  function progressBar(c) {
    if (!c.progress_total) return '';
    const pct = Math.round((c.progress_current / c.progress_total) * 100);
    return `
      <div style="margin-top:6px;background:var(--surface);border-radius:999px;height:6px;overflow:hidden;">
        <div style="width:${pct}%;height:100%;background:var(--accent);"></div>
      </div>
      <div class="cmd-meta">progress: ${c.progress_current}/${c.progress_total}</div>
    `;
  }

  async function loadHistory() {
    try {
      const history = await apiFetch('/commands/history?limit=30');
      if (!history) return;
      document.getElementById('command-history').innerHTML = history.map((c) => `
        <div class="command-entry">
          <div class="cmd-text">"${c.raw_text}"</div>
          <div class="cmd-meta">
            action: ${c.parsed_action || '-'} - ${statusBadge(c.status)} - ${c.created_at}
          </div>
          ${progressBar(c)}
          ${c.status === 'failed' ? `<div class="cmd-meta" style="color:var(--danger);">error: ${c.result || ''}</div>` : ''}
        </div>
      `).join('') || `<p style="color:var(--text-muted);">Belum ada perintah</p>`;

      // Keep polling while any command is still executing, so progress
      // bars update live without a full page reload.
      const stillRunning = history.some((c) => c.status === 'executing');
      if (stillRunning) ensurePolling(); else stopPolling();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  function ensurePolling() {
    if (pollTimer) return;
    pollTimer = setInterval(loadHistory, 3000);
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  loadHistory();
</script>
</body>
</html>
