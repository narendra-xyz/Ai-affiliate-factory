<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - TikTok Shop - AI Affiliate Factory</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div id="toast-container"></div>
<div class="layout" id="app-shell"></div>

<template id="tpl-content">
  <div class="card" style="margin-bottom:14px;">
    <div class="card-header">
      <h2>Status Integrasi TikTok Shop</h2>
      <button class="btn" id="connect-btn"><i data-lucide="link"></i> Connect TikTok Shop Creator</button>
    </div>
    <table>
      <tbody>
        <tr><td>App Terkonfigurasi</td><td id="s-app-status">-</td></tr>
        <tr><td>Keterangan</td><td id="s-app-detail" style="color:var(--text-muted);">-</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card" style="margin-bottom:14px;">
    <div class="card-header"><h2>Akun TikTok Shop Creator</h2></div>
    <table>
      <thead>
        <tr><th>Shop</th><th>Status</th><th>Permission</th><th>Token Berlaku Sampai</th><th></th></tr>
      </thead>
      <tbody id="accounts-tbody"></tbody>
    </table>
    <p id="accounts-empty" style="color:var(--text-muted);display:none;margin-top:12px;">
      Belum ada akun TikTok Shop yang terhubung.
    </p>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Katalog Produk TikTok Shop</h2>
      <button class="btn btn-secondary" id="sync-products-btn"><i data-lucide="refresh-cw"></i> Sync Produk</button>
    </div>
    <p class="card-sub" style="margin:-4px 0 12px;">
      Produk yang tersedia untuk creator/showcase Anda. Hubungkan ke produk internal di halaman Products
      supaya bisa dipakai saat publish shoppable video.
    </p>
    <table>
      <thead><tr><th></th><th>Nama Produk</th><th>Harga</th><th>Status</th><th>TikTok Shop Product ID</th></tr></thead>
      <tbody id="products-tbody"></tbody>
    </table>
    <p id="products-empty" style="color:var(--text-muted);display:none;margin-top:12px;">
      Belum ada produk TikTok Shop yang di-sync.
    </p>
  </div>
</template>

<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
  mountShell('/settings.html', 'Settings - TikTok Shop', 'Kelola koneksi TikTok Shop Creator dan mapping produk untuk shoppable video');
  document.getElementById('page-content').appendChild(document.getElementById('tpl-content').content.cloneNode(true));

  (function handleOAuthRedirect() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('connected')) {
      showToast('Akun TikTok Shop berhasil terhubung');
      window.history.replaceState({}, '', '/settings-tiktok-shop.html');
    } else if (params.get('error')) {
      showToast(`Gagal menghubungkan TikTok Shop: ${params.get('error')}`, 'error');
      window.history.replaceState({}, '', '/settings-tiktok-shop.html');
    }
  })();

  document.getElementById('connect-btn').addEventListener('click', () => {
    const token = getToken();
    if (!token) { showToast('Sesi login tidak ditemukan', 'error'); return; }
    window.location.href = `/api/tiktok-shop/auth/connect?token=${encodeURIComponent(token)}`;
  });

  let currentAccounts = [];

  function statusBadge(status) {
    const map = { connected: 'active', expired: 'error', error: 'error', disconnected: 'idle' };
    return `<span class="badge badge-${map[status] || 'idle'}"><span class="badge-dot"></span>${status}</span>`;
  }

  function scopeBadges(scopes) {
    const list = (scopes || '').split(/[\s,]+/).filter(Boolean);
    if (list.length === 0) return '<span style="color:var(--text-muted);">-</span>';
    return list.map((s) => `<span class="badge badge-idle" style="margin-right:4px;"><span class="badge-dot"></span>${s}</span>`).join('');
  }

  async function loadIntegrationStatus() {
    try {
      const integrations = await apiFetch('/system/integrations');
      if (!integrations) return;
      const shop = integrations.find((i) => i.key === 'tiktok_shop');
      if (!shop) return;
      document.getElementById('s-app-status').innerHTML = shop.configured
        ? `<span class="badge badge-active"><span class="badge-dot"></span>Configured</span>`
        : `<span class="badge badge-idle"><span class="badge-dot"></span>Not Configured</span>`;
      document.getElementById('s-app-detail').textContent = shop.detail;
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function disconnect(id) {
    if (!confirm('Putuskan koneksi akun TikTok Shop ini?')) return;
    try {
      await apiFetch(`/tiktok-shop/accounts/${id}/disconnect`, { method: 'POST' });
      showToast('Akun terputus');
      loadAccounts();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function loadAccounts() {
    try {
      const accounts = await apiFetch('/tiktok-shop/accounts');
      if (!accounts) return;
      currentAccounts = accounts;

      document.getElementById('accounts-empty').style.display = accounts.length === 0 ? 'block' : 'none';
      document.getElementById('accounts-tbody').innerHTML = accounts.map((a) => `
        <tr>
          <td>${a.shop_name || a.shop_creator_id}</td>
          <td>${statusBadge(a.status)}</td>
          <td>${scopeBadges(a.scopes)}</td>
          <td style="color:var(--text-muted);font-size:12px;">${a.access_token_expires_at ? new Date(a.access_token_expires_at).toLocaleString('id-ID') : '-'}</td>
          <td><button class="btn btn-secondary" onclick="disconnect(${a.id})">Disconnect</button></td>
        </tr>
      `).join('');
      lucide.createIcons();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  document.getElementById('sync-products-btn').addEventListener('click', async () => {
    if (currentAccounts.length === 0) { showToast('Hubungkan akun TikTok Shop dulu', 'error'); return; }
    const connected = currentAccounts.find((a) => a.status === 'connected');
    if (!connected) { showToast('Tidak ada akun TikTok Shop yang berstatus connected', 'error'); return; }
    try {
      const result = await apiFetch(`/tiktok-shop/accounts/${connected.id}/sync-products`, { method: 'POST' });
      showToast(`${result.count} produk berhasil di-sync`);
      loadProducts();
    } catch (err) {
      showToast(err.message, 'error');
    }
  });

  async function loadProducts() {
    try {
      const products = await apiFetch('/tiktok-shop/products');
      if (!products) return;

      document.getElementById('products-empty').style.display = products.length === 0 ? 'block' : 'none';
      document.getElementById('products-tbody').innerHTML = products.map((p) => `
        <tr>
          <td>${p.image_url ? `<img src="${p.image_url}" style="width:40px;height:40px;object-fit:cover;border-radius:6px;">` : ''}</td>
          <td>${p.name || '-'}</td>
          <td>${p.price ? `${p.currency || ''} ${p.price}` : '-'}</td>
          <td>${p.availability_status || '-'}</td>
          <td style="color:var(--text-muted);font-size:12px;">${p.tiktok_shop_product_id}</td>
        </tr>
      `).join('');
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  loadIntegrationStatus();
  loadAccounts();
  loadProducts();
</script>
</body>
</html>
